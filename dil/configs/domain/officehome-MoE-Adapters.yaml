hydra:
  run:
    dir: ./experiments/${scenario}/${dataset}-${method}
  job:
    chdir: true

  job_logging:
    version: 1
    formatters:
      simple:
        format: "%(message)s"

class_order: ""
dataset_root: ""
workdir: ""
log_path: "metrics.json"
model_name: "ViT-B/16"
prompt_template: "a photo of a {}."

batch_size: 64
increment: 65
initial_increment: 65
num_classes: 65
scenario: "domain"
dataset: "officehome"
domain_order: 1

weight_decay: 0.0
l2: 0
ce_method: 0

method: "MoE-Adapters"
lr: 1e-3
ls: 0.0
